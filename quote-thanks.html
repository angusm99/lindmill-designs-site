<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brief received — Lindmill Designs</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="images/lindmill-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Narnia';
      src: url('fonts/Narnia.ttf') format('truetype'),
           url('fonts/Narnia.otf') format('opentype');
      font-display: swap;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', 'Arial Rounded MT Bold', system-ui, sans-serif;
      background: #ffffff;
      color: #143465;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      gap: 1.2rem;
    }
    .logo { width: 72px; height: 72px; object-fit: contain; }
    h1 {
      font-family: 'Narnia', 'Fredoka', sans-serif;
      font-size: clamp(2.4rem, 7vw, 4rem);
      color: #fe2786;
      letter-spacing: 0.03em;
      line-height: 0.95;
    }
    p { max-width: 460px; line-height: 1.7; font-size: 1rem; }
    .btn {
      display: inline-block;
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #fff;
      background: #fe2786;
      text-decoration: none;
      border-radius: 100px;
      padding: 14px 36px;
      margin-top: 0.6rem;
      transition: transform 0.18s ease;
    }
    .btn:hover { transform: scale(1.06); }
  </style>
</head>
<body>
  <img class="logo" src="images/updated-logo.gif" alt="Lindmill Designs">
  <h1>BRIEF RECEIVED!</h1>
  <p>Thanks — your brief and files are on their way to Linda. She'll be in touch at the email address you gave, usually within a day or two.</p>
  <a class="btn" href="index.html#work">Back to the portfolio</a>
</body>
</html>
